<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="STAR'S PHOTO STUDIO NEPAL - Premier photographer in Kathmandu & Pokhara. Award-winning wedding photos, creative portraits, cinematic storytelling. Book your dream session today!">
  <meta name="keywords" content="photographer in Kathmandu, wedding photos Nepal, STAR'S PHOTO STUDIO, best photography packages, photo tips, client highlights, wedding photography, engagement shoot">
  <meta name="author" content="STAR'S PHOTO STUDIO NEPAL">
  <meta name="robots" content="index, follow">
  <title>STAR'S PHOTO STUDIO | Elite Photography in Nepal</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: elegant + modern -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0b0f;
      color: #ece8e0;
      scroll-behavior: smooth;
      line-height: 1.5;
    }

    h1, h2, h3, h4, .logo-text, .hero h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* glassmorphism and dark elegant theme */
    header {
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(12px);
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(245, 197, 66, 0.25);
      transition: 0.3s;
    }

    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      background: linear-gradient(135deg, #f5c542, #d4a02b);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(245,197,66,0.4);
    }

    .logo-icon i {
      font-size: 1.9rem;
      color: #0b0b0f;
    }

    .logo h1 {
      font-size: 1.85rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f9e0a0, #e6b422);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo span {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #c0b58a;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #f0ebdd;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.25s;
      position: relative;
    }

    .nav-links a:after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 2px;
      background: #f5c542;
      transition: 0.3s;
    }

    .nav-links a:hover:after, .nav-links a.active:after {
      width: 100%;
    }

    .nav-links a.active {
      color: #f5c542;
    }

    /* hero section */
    .hero {
      background: linear-gradient(125deg, #030305d9, #0f0f1ad9), url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1600&h=700&fit=crop') center/cover no-repeat;
      min-height: 85vh;
      display: flex;
      align-items: center;
      text-align: center;
    }

    .hero h2 {
      font-size: 4rem;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 680px;
      margin: 20px auto;
      opacity: 0.9;
    }

    .btn {
      background: #f5c542;
      color: #0f0f14;
      padding: 14px 38px;
      font-weight: 800;
      border-radius: 50px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #f5c542;
      color: #f5c542;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: #f5c542;
      color: #0b0b0f;
    }

    .btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.05);
    }

    section {
      padding: 90px 0;
      border-bottom: 1px solid rgba(245, 197, 66, 0.15);
    }

    .section-title {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 55px;
      font-weight: 700;
    }

    .section-title span {
      color: #f5c542;
      border-bottom: 2px solid #f5c542;
      display: inline-block;
      padding-bottom: 6px;
    }

    /* gallery grid premium */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 28px;
    }

    .gallery-card {
      border-radius: 24px;
      overflow: hidden;
      background: #15151e;
      transition: 0.4s;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0,0,0,0.3);
    }

    .gallery-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      transition: 0.4s;
      display: block;
    }

    .gallery-card:hover img {
      transform: scale(1.03);
    }

    .gallery-card .info {
      padding: 18px;
    }

    /* packages styling */
    .packages-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 35px;
      justify-content: center;
    }

    .package-card {
      background: #121217;
      border-radius: 32px;
      padding: 32px 24px;
      flex: 1;
      min-width: 260px;
      border: 1px solid #2c2a2a;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .package-card:hover {
      border-color: #f5c542;
      transform: translateY(-10px);
    }

    .price {
      font-size: 2.2rem;
      font-weight: 800;
      color: #f5c542;
    }

    /* booking form */
    .booking-card {
      background: #111116;
      padding: 48px;
      border-radius: 48px;
      border: 1px solid #2a271f;
      box-shadow: 0 25px 40px rgba(0,0,0,0.5);
    }

    .form-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      margin-bottom: 22px;
    }

    .input-group input, .input-group select, .input-group textarea {
      width: 100%;
      padding: 16px 20px;
      background: #1e1e28;
      border: 1px solid #35332b;
      border-radius: 60px;
      color: #f0ebdd;
      font-size: 1rem;
    }

    .input-group textarea {
      border-radius: 28px;
    }

    /* tips & highlights */
    .insight-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
    }

    .tips-panel, .testimonial-panel {
      flex: 1;
      background: #12121a;
      padding: 32px;
      border-radius: 32px;
    }

    .client-item {
      border-left: 3px solid #f5c542;
      padding-left: 20px;
      margin-bottom: 28px;
    }

    /* footer */
    footer {
      background: #060608;
      padding: 50px 0 30px;
      text-align: center;
      border-top: 1px solid #22201b;
    }

    @media (max-width: 800px) {
      .hero h2 { font-size: 2.5rem; }
      .section-title { font-size: 2.2rem; }
      .booking-card { padding: 28px; }
    }

    /* lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 85%;
      max-height: 85%;
      border-radius: 20px;
      border: 2px solid #f5c542;
    }
    .close-light {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2.5rem;
      color: #f5c542;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="container header-flex">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-camera-retro"></i></div>
      <div>
        <h1>STAR'S PHOTO STUDIO</h1>
        <span>EST. 2012 — 2026 | NEPAL • KATHMANDU</span>
      </div>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-link active" data-page="home">HOME</a>
      <a href="#" class="nav-link" data-page="portfolio">PORTFOLIO</a>
      <a href="#" class="nav-link" data-page="packages">PACKAGES</a>
      <a href="#" class="nav-link" data-page="booking">BOOKING</a>
      <a href="#" class="nav-link" data-page="contact">CONTACT</a>
    </div>
  </div>
</header>

<main id="app-root"></main>

<footer>
  <div class="container">
    <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 25px;">
      <i class="fab fa-instagram" style="font-size: 1.5rem; color: #f5c542;"></i>
      <i class="fab fa-facebook-f" style="font-size: 1.5rem; color: #f5c542;"></i>
      <i class="fab fa-pinterest" style="font-size: 1.5rem; color: #f5c542;"></i>
    </div>
    <p>© 2026 STAR'S PHOTO STUDIO NEPAL — Premier Photographer in Kathmandu | Award-Winning Wedding & Fine Art Photography</p>
    <p style="margin-top: 12px; font-size: 0.85rem;">📍 Lazimpat, Kathmandu | Lakeside, Pokhara | hello@starsphoto.com.np</p>
  </div>
</footer>

<!-- lightbox component -->
<div id="lightbox" class="lightbox">
  <span class="close-light">&times;</span>
  <img id="lightbox-img" src="" alt="full size">
</div>

<script>
  // -------- ULTRA PREMIUM PHOTOGRAPHY SAMPLES (realistic unsplash images) ----------
  const portfolioSamples = [
    { src: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=600&h=450&fit=crop", title: "Royal Wedding Moment", category: "Wedding Elegance" },
    { src: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?w=600&h=450&fit=crop", title: "Bridal Glow", category: "Portrait" },
    { src: "https://images.unsplash.com/photo-1519741497674-611481863552?w=600&h=450&fit=crop", title: "Candid Kiss", category: "Wedding Story" },
    { src: "https://images.unsplash.com/photo-1523437113738-bbd3cc89fb6b?w=600&h=450&fit=crop", title: "Golden Hour Couple", category: "Engagement" },
    { src: "https://images.unsplash.com/photo-1505228395891-9a51e7e86a6b?w=600&h=450&fit=crop", title: "Mountain Elopement", category: "Destination" },
    { src: "https://images.unsplash.com/photo-1583939003579-730e3938e45e?w=600&h=450&fit=crop", title: "Festival Highlights", category: "Cultural" },
    { src: "https://images.unsplash.com/photo-1551803091-e20673f15770?w=600&h=450&fit=crop", title: "Modern Studio", category: "Creative" },
    { src: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=600&h=450&fit=crop", title: "Wedding Party Joy", category: "Event" }
  ];

  // Packages data
  const packagesData = [
    { name: "GOLDEN HOUR", price: "NPR 29,999", features: ["2 hours coverage", "60+ edited digital images", "Online gallery", "1 location within valley"] },
    { name: "ROYAL WEDDING", price: "NPR 1,25,000", features: ["Full day (10+ hrs)", "500+ hi-res photos", "Pre-wedding consult", "Fine art album design", "Drone shot (selected)"] },
    { name: "CINEMATIC STORY", price: "NPR 72,500", features: ["6 hours event", "200+ images", "Behind the scenes reel", "Print rights & travel support"] }
  ];

  const photoTipsList = [
    "Golden hour magic always elevates wedding photos — schedule your session 1hr before sunset.",
    "Embrace candid moments; authentic emotion beats any pose.",
    "Use natural reflectors like white walls, snow, or sand for soft fill light.",
    "Engagement shoots before the wedding? It builds chemistry with your photographer!"
  ];

  const clientReviews = [
    { name: "Preeti & Suman", text: "STAR'S captured our wedding like a dream. Every single photo tells a story! Best photographer in Nepal.", location: "Kathmandu" },
    { name: "Rohan & Sneha", text: "The team was professional, creative, and made us feel so comfortable. Our wedding album is breathtaking.", location: "Pokhara" },
    { name: "Nisha Gurung", text: "Their attention to detail and use of natural light is unmatched. Highly recommend for weddings and portraits.", location: "Lalitpur" }
  ];

  // helper navigation and render
  let currentPage = "home";

  function setActiveNav(page) {
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute('data-page') === page) link.classList.add('active');
      else link.classList.remove('active');
    });
  }

  // lightbox activation
  function initLightbox() {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.close-light');
    document.querySelectorAll('.gallery-card').forEach(card => {
      card.addEventListener('click', (e) => {
        const imgSrc = card.querySelector('img')?.getAttribute('src');
        if (imgSrc) {
          lightboxImg.src = imgSrc;
          lightbox.classList.add('active');
        }
      });
    });
    if (closeBtn) closeBtn.onclick = () => lightbox.classList.remove('active');
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('active'); });
  }

  function renderPage(page) {
    currentPage = page;
    setActiveNav(page);
    const app = document.getElementById('app-root');
    if (!app) return;

    if (page === 'home') {
      app.innerHTML = `
        <section class="hero">
          <div class="container">
            <h2>STAR'S PHOTO STUDIO<br> <span style="color:#f5c542;">Where Every Frame Shines</span></h2>
            <p>Nepal's most sought-after photography studio — specializing in wedding photos, timeless portraits, and cinematic storytelling.</p>
            <a href="#" class="btn" data-nav="booking">BOOK YOUR SESSION →</a>
            <a href="#" class="btn btn-outline" data-nav="portfolio" style="margin-left: 15px;">VIEW GALLERY</a>
          </div>
        </section>
        <div class="container">
          <section>
            <h2 class="section-title"><span>Signature Craftsmanship</span></h2>
            <div style="display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; text-align: center;">
              <div><i class="fas fa-award" style="font-size: 3rem; color:#f5c542;"></i><h3 style="margin-top: 12px;">Award Winner</h3><p>Wedding Photographer of the Year 2024</p></div>
              <div><i class="fas fa-map-marked-alt" style="font-size: 3rem; color:#f5c542;"></i><h3 style="margin-top: 12px;">Pan-Nepal Coverage</h3><p>Kathmandu · Pokhara · Mustang</p></div>
              <div><i class="fas fa-images" style="font-size: 3rem; color:#f5c542;"></i><h3 style="margin-top: 12px;">500+ Weddings</h3><p>Stories of love & legacy</p></div>
            </div>
          </section>

          <section>
            <div class="insight-flex">
              <div class="tips-panel">
                <h3><i class="fas fa-lightbulb" style="color:#f5c542;"></i> Pro Photo Tips</h3>
                <ul style="list-style: none; margin-top: 20px;">
                  ${photoTipsList.map(tip => `<li style="margin-bottom: 15px;"><i class="fas fa-camera" style="margin-right: 12px; color:#f5c542;"></i> ${tip}</li>`).join('')}
                </ul>
              </div>
              <div class="testimonial-panel">
                <h3><i class="fas fa-star" style="color:#f5c542;"></i> Client Highlights</h3>
                ${clientReviews.map(rev => `<div class="client-item"><p><i class="fas fa-quote-left" style="margin-right:8px; color:#ba8b2c;"></i> "${rev.text}"</p><p style="margin-top: 10px;"><strong>— ${rev.name}</strong>, ${rev.location}</p></div>`).join('')}
              </div>
            </div>
          </section>

          <section>
            <h2 class="section-title"><span>Featured Work</span></h2>
            <div class="gallery-grid" id="home-gallery">
              ${portfolioSamples.slice(0, 4).map(sample => `
                <div class="gallery-card">
                  <img src="${sample.src}" alt="${sample.title}" loading="lazy">
                  <div class="info"><h4>${sample.title}</h4><p style="color:#cfc8b5;">${sample.category}</p></div>
                </div>
              `).join('')}
            </div>
            <div style="text-align: center; margin-top: 40px;"><a href="#" class="btn" data-nav="portfolio">View Full Portfolio →</a></div>
          </section>
        </div>
      `;
    } 
    else if (page === 'portfolio') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title"><span>Our Visual Chronicle</span></h2>
            <p style="text-align:center; margin-bottom: 50px;">Real weddings, engagements & editorials — a sneak peek into our artistry.</p>
            <div class="gallery-grid" id="full-gallery">
              ${portfolioSamples.map(sample => `
                <div class="gallery-card">
                  <img src="${sample.src}" alt="${sample.title}" loading="lazy">
                  <div class="info"><h4>${sample.title}</h4><p style="color:#cfc8b5;">${sample.category}</p></div>
                </div>
              `).join('')}
            </div>
            <div style="margin-top: 40px; background: linear-gradient(145deg,#13131c, #0c0c12); border-radius: 40px; padding: 35px; text-align:center;">
              <i class="fas fa-video" style="font-size: 2rem;"></i> <p style="margin-top:12px;">We also shoot cinematic highlight films & behind-the-scenes. Inquire for wedding cinematography.</p>
            </div>
          </section>
        </div>
      `;
    } 
    else if (page === 'packages') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title"><span>Photography Investments</span></h2>
            <p style="text-align:center; margin-bottom: 40px;">Tailored packages for every celebration, with flexible add-ons. All prices include final edited images.</p>
            <div class="packages-grid">
              ${packagesData.map(pkg => `
                <div class="package-card">
                  <h3 style="font-size: 2rem;">${pkg.name}</h3>
                  <div class="price">${pkg.price}</div>
                  <ul style="list-style: none; margin: 25px 0;">
                    ${pkg.features.map(f => `<li style="margin: 12px 0;"><i class="fas fa-check-circle" style="color:#f5c542; margin-right: 10px;"></i> ${f}</li>`).join('')}
                  </ul>
                  <a href="#" class="btn" data-nav="booking" style="background:#f5c542; color:#000;">Book This Package</a>
                </div>
              `).join('')}
            </div>
            <div style="margin-top: 50px; text-align:center; background: #121217; border-radius: 40px; padding: 28px;">
              <h3>✨ Destination Wedding Special</h3>
              <p>Travel beyond Kathmandu? Ask about our custom itinerary packages (Pokhara, Mustang, Chitwan).</p>
            </div>
          </section>
        </div>
      `;
    } 
    else if (page === 'booking') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title"><span>Reserve Your Moment</span></h2>
            <div class="booking-card">
              <form id="luxuryBookingForm">
                <div class="form-row">
                  <div class="input-group"><input type="text" placeholder="Full name *" id="bookName" required></div>
                  <div class="input-group"><input type="email" placeholder="Email address *" id="bookEmail" required></div>
                </div>
                <div class="form-row">
                  <div class="input-group"><input type="tel" placeholder="Phone / WhatsApp"></div>
                  <div class="input-group"><select id="interestPackage"><option value="">Select package interest</option><option>Golden Hour</option><option>Royal Wedding</option><option>Cinematic Story</option><option>Custom / Destination</option></select></div>
                </div>
                <div class="form-row">
                  <div class="input-group"><input type="date" id="eventDate"></div>
                  <div class="input-group"><input type="text" placeholder="Event location (City, Venue)"></div>
                </div>
                <div class="input-group"><textarea rows="3" placeholder="Tell us about your vision (couple names, special requests...)"></textarea></div>

            </div>

            </div>
          </section>
        </div>
      `;
      const form = document.getElementById('luxuryBookingForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('bookName')?.value;
          const email = document.getElementById('bookEmail')?.value;
          if (!name || !email) {
            document.getElementById('bookingMessage').innerHTML = '⚠️ Please fill name and email.';
            return;
          }
          document.getElementById('bookingMessage').innerHTML = `✅ Thank you ${name}! Your booking inquiry has been received. We'll get back to you within 24 hours.`;
          form.reset();
        });
      }
    }
    else if (page === 'contact') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title"><span>Let's Create Together</span></h2>
            <div style="display: flex; flex-wrap: wrap; gap: 50px;">
              <div style="flex:1; background:#121217; padding: 40px; border-radius: 36px;">
                <h3><i class="fas fa-map-pin" style="color:#f5c542;"></i> Visit Our Atelier</h3>
                <p><strong>Kathmandu Studio:</strong> 3rd Floor, Lazimpat Gallery, Kathmandu, Nepal</p>
                <p><strong>Pokhara Creative Hub:</strong> Lakeside Rd, Pokhara-6</p>
                <hr style="margin: 20px 0; border-color:#2a2a33;">
                <p><i class="fas fa-phone"></i> +977 9812345678</p>
                <p><i class="fas fa-envelope"></i> hello@starsphotostudio.com</p>
                <p><i class="fab fa-instagram"></i> @starsphoto_nepal</p>
              </div>
              <div style="flex:1; background:#121217; padding: 40px; border-radius: 36px;">
                <h3>We're the #1 Photographer in Kathmandu</h3>
                <p>Covering weddings, engagements, fashion editorials, and event photography across Nepal. Trusted by 500+ couples.</p>
                <div style="margin-top: 20px;"><i class="fas fa-trophy"></i> 'Best Wedding Photography Studio 2025' - Nepal Photo Awards</div>
                <a href="#" class="btn" data-nav="booking" style="margin-top: 32px; display:inline-block;">Inquire Now</a>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    // re-attach navigation for dynamic buttons and lightbox
    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const target = btn.getAttribute('data-nav');
        if (target && ['home','portfolio','packages','booking','contact'].includes(target)) {
          renderPage(target);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
    // init lightbox for gallery cards in current rendered page
    setTimeout(() => {
      const lightboxDiv = document.getElementById('lightbox');
      if (lightboxDiv) {
        const imgs = document.querySelectorAll('.gallery-card');
        imgs.forEach(card => {
          card.style.cursor = 'pointer';
          card.addEventListener('click', (e) => {
            const img = card.querySelector('img');
            if (img && img.src) {
              document.getElementById('lightbox-img').src = img.src;
              document.getElementById('lightbox').classList.add('active');
            }
          });
        });
      }
    }, 50);
  }

  // initial render + lightbox close management
  renderPage('home');
  const lightboxSystem = () => {
    const closeBtn = document.querySelector('.close-light');
    if (closeBtn) closeBtn.onclick = () => document.getElementById('lightbox').classList.remove('active');
    const lb = document.getElementById('lightbox');
    if (lb) lb.addEventListener('click', (e) => { if (e.target === lb) lb.classList.remove('active'); });
  };
  setTimeout(lightboxSystem, 100);
</script>
</body>
</html>
