    }
    else if (page === 'booking') {
      app.innerHTML = `<div class="container"><section><h2 class="section-title"><span>Secure Your Date</span></h2><div style="background:#111827cc; padding:40px; border-radius:48px;"><form id="bookingForm"><div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:20px;"><div style="flex:1"><input type="text" id="bName" placeholder="Full name *" style="width:100%; padding:14px; border-radius:60px; background:#0f172a; border:1px solid #ffd966;"></div><div style="flex:1"><input type="email" id="bEmail" placeholder="Email *" style="width:100%; padding:14px; border-radius:60px; background:#0f172a;"></div></div><div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:20px;"><div style="flex:1"><input type="tel" placeholder="Phone"></div><div style="flex:1"><select id="bPackage" style="width:100%; padding:14px;"><option>Essential</option><option>Premium Wedding</option><option>Cinematic</option></select></div></div><div style="display:flex; gap:20px; margin-bottom:20px;"><div style="flex:1"><input type="date" id="bDate" min="${new Date().toISOString().split('T')[0]}" style="width:100%; padding:14px;"></div><div style="flex:1"><input type="text" placeholder="Location"></div></div><div><textarea rows="3" placeholder="Your vision..." style="width:100%; padding:14px; border-radius:28px;"></textarea></div><button type="submit" class="btn" style="width:100%; margin-top:20px;">Send Request →</button><p id="bookMsg" style="margin-top:20px;"></p></form></div><div style="margin-top:40px; display:flex; gap:30px; justify-content:center; flex-wrap:wrap;"><div><i class="fas fa-headset"></i> 12h response</div><div><i class="fas fa-calendar"></i> Free consult</div><div><i class="fas fa-lock"></i> Secure</div></div></section></div>`;
      const form = document.getElementById('bookingForm');
      if (form) form.addEventListener('submit', (e) => { e.preventDefault(); const name = document.getElementById('bName')?.value.trim(); if (!name) { document.getElementById('bookMsg').innerHTML = '⚠️ Enter your name.'; return; } document.getElementById('bookMsg').innerHTML = `✅ Thank you ${name}! We'll contact within 12h.`; form.reset(); });
    }
    else if (page === 'contact') {
      app.innerHTML = `<div class="container"><section><h2 class="section-title"><span>Connect With Us</span></h2><div style="display:flex; flex-wrap:wrap; gap:50px;"><div style="flex:1; background:#111827cc; padding:40px; border-radius:36px;"><h3><i class="fas fa-map-pin"></i> Our Studio</h3><ul class="contact-list"><li><i class="fas fa-location-dot"></i> Tilottama-5, Butwal, Lumbini, Nepal</li><li><i class="fas fa-phone-alt"></i> +977 9876543210</li><li><i class="fas fa-envelope"></i> starsstudio321@gmail.com</li><li><i class="fab fa-facebook"></i> facebook.com/STARSStudioButwal</li><li><i class="fab fa-instagram"></i> instagram.com/starsstudio_butwal</li><li><i class="fab fa-github"></i> github.com/starstudio</li><li><i class="fab fa-whatsapp"></i> wa.me/9779876543210</li></ul><hr style="margin:20px 0;"><p><strong>Owner / Creative Director:</strong> TTC BOYS</p></div><div style="flex:1; background:#111827cc; padding:40px; border-radius:36px;"><h3>📸 Let's Create Magic</h3><p>We respond within 12 hours. Follow us on social media for daily inspiration, offers, and behind‑the‑scenes.</p><div style="margin:25px 0;"><i class="fas fa-clock"></i> Mon-Sat: 9AM - 6PM</div><a class="btn" data-nav="booking" style="margin-top:15px;">Book a Consultation →</a></div></div></section></div>`;
    }
    
    // Re-attach all [data-nav] buttons (internal navigation)
    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.removeEventListener('click', btn._navHandler);
      btn._navHandler = (e) => {
        e.preventDefault();
        const target = btn.dataset.nav;
        if (target && ['home','portfolio','packages','booking','contact'].includes(target)) {
          window.location.hash = target;
          renderPage(target);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          if (navLinksEl.classList.contains('active')) navLinksEl.classList.remove('active');
          if (menuToggle?.querySelector('i')) menuToggle.querySelector('i').classList.replace('fa-times','fa-bars');
        }
      };
      btn.addEventListener('click', btn._navHandler);
    });
    attachLightbox();
    // scroll reveal
    document.querySelectorAll('.feature-card, .package-card, .gallery-card, [style*="background:#111827cc"]').forEach(el => el.classList.add('fade-up'));
    const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.1 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  }
  
  // Hash routing (so URL changes and back/forward work)
  function handleHash() {
    const hash = window.location.hash.slice(1);
    if (['home','portfolio','packages','booking','contact'].includes(hash)) renderPage(hash);
    else renderPage('home');
  }
  window.addEventListener('hashchange', handleHash);
  if (!window.location.hash || window.location.hash === '#') window.location.hash = '#home';
  handleHash();
  
  // Logo click: go home
  document.getElementById('logoHome')?.addEventListener('click', () => {
    if (window.location.hash !== '#home') window.location.hash = 'home';
    else renderPage('home');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  
  // Mobile menu toggle
  if (menuToggle && navLinksEl) {
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      navLinksEl.classList.toggle('active');
      const icon = menuToggle.querySelector('i');
      if (icon) {
        if (navLinksEl.classList.contains('active')) {
          icon.classList.remove('fa-bars');
          icon.classList.add('fa-times');
        } else {
          icon.classList.remove('fa-times');
          icon.classList.add('fa-bars');
        }
      }
    });
    navLinksEl.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        navLinksEl.classList.remove('active');
        const icon = menuToggle.querySelector('i');
        if (icon) {
          icon.classList.remove('fa-times');
          icon.classList.add('fa-bars');
        }
      });
    });
  }
  
  // Back to top button
  const backBtn = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) backBtn.classList.add('show');
    else backBtn.classList.remove('show');
  });
  if (backBtn) backBtn.addEventListener('click', (e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  
  // Lightbox close
  const lightbox = document.getElementById('lightbox');
  const closeLight = document.querySelector('.close-light');
  if (closeLight) closeLight.onclick = () => lightbox.classList.remove('active');
  if (lightbox) lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('active'); });
</script>
</body>
</html>
