<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="STAR'S PHOTO STUDIO NEPAL - Professional photographer in Kathmandu, wedding photos, portfolio, packages, and booking. Capturing your special moments with creativity and precision.">
  <meta name="keywords" content="photographer in Kathmandu, wedding photos Nepal, STAR'S PHOTO STUDIO, photography packages, photo tips, client highlights">
  <meta name="author" content="STAR'S PHOTO STUDIO NEPAL">
  <meta name="robots" content="index, follow">
  <title>STAR'S PHOTO STUDIO | Professional Photographer in Nepal</title>
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: clean modern fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #fefcf7;
      color: #1e1e2a;
      scroll-behavior: smooth;
      line-height: 1.5;
    }

    h1, h2, h3, .logo-text {
      font-family: 'Playfair Display', serif;
    }

    /* container utility */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header & Navigation */
    header {
      background: #000000;
      color: #f9f5e8;
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo i {
      font-size: 2rem;
      color: #f5c542;
    }

    .logo h1 {
      font-size: 1.7rem;
      letter-spacing: 1px;
    }

    .logo span {
      font-weight: 300;
      font-size: 0.9rem;
      display: block;
      color: #e0d6c0;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #f9f5e8;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
      font-size: 1rem;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #f5c542;
    }

    /* hero */
    .hero {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.5)), url('https://placehold.co/1600x600/2c2c2c/f5c542?text=STAR+PHOTOGRAPHY+STUDIO') center/cover no-repeat;
      background-size: cover;
      padding: 110px 20px;
      text-align: center;
      color: white;
    }

    .hero h2 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto 30px;
      font-weight: 400;
    }

    .btn {
      background: #f5c542;
      color: #1e1e2a;
      padding: 12px 32px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 40px;
      transition: 0.3s;
      display: inline-block;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:hover {
      background: #e0b035;
      transform: scale(1.02);
    }

    section {
      padding: 80px 0;
      border-bottom: 1px solid #eee5d8;
    }

    .section-title {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 50px;
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .section-title:after {
      content: '';
      display: block;
      width: 70px;
      height: 3px;
      background: #f5c542;
      margin: 12px auto 0;
    }

    /* Portfolio grid */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .portfolio-item {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 25px rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    .portfolio-item img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .portfolio-item h3 {
      padding: 20px 20px 5px;
      font-size: 1.3rem;
    }

    .portfolio-item p {
      padding: 0 20px 20px;
      color: #555;
    }

    /* packages cards */
    .packages-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .package-card {
      background: white;
      flex: 1;
      min-width: 260px;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      transition: 0.2s;
      border: 1px solid #f0e7da;
    }

    .package-card:hover {
      transform: translateY(-6px);
    }

    .package-card h3 {
      font-size: 1.8rem;
    }

    .price {
      font-size: 2rem;
      font-weight: 800;
      color: #c49a2b;
      margin: 15px 0;
    }

    .package-card ul {
      list-style: none;
      margin: 20px 0;
    }

    .package-card li {
      margin: 10px 0;
    }

    /* booking form styling */
    .booking-form {
      background: #fffcf5;
      padding: 40px;
      border-radius: 36px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.05);
      max-width: 750px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #e2d6c4;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      background: white;
    }

    .form-group textarea {
      border-radius: 28px;
      resize: vertical;
    }

    .booking-form button {
      width: 100%;
      background: #000000;
      color: #f5c542;
      border: none;
      padding: 14px;
      border-radius: 60px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* tips & highlights flex */
    .tips-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: space-between;
    }

    .tips-box, .highlights-box {
      flex: 1;
      background: #ffffffea;
      padding: 28px;
      border-radius: 32px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
      border: 1px solid #f3ecd9;
    }

    .tips-box h3, .highlights-box h3 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tips-list {
      list-style: none;
    }

    .tips-list li {
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: baseline;
    }

    .tips-list i {
      color: #f5c542;
      width: 24px;
    }

    .highlight-card {
      background: #fef6e8;
      padding: 20px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    /* contact info */
    .contact-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: space-between;
    }

    .contact-details {
      flex: 1;
      background: white;
      padding: 30px;
      border-radius: 28px;
    }

    .contact-details i {
      width: 35px;
      color: #f5c542;
      font-size: 1.4rem;
    }

    .map-placeholder {
      flex: 1;
      background: #e5ddce;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-style: italic;
      color: #4a3b23;
    }

    footer {
      background: #0f0f12;
      color: #c9c6b9;
      text-align: center;
      padding: 30px 0;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .header-flex {
        flex-direction: column;
      }
      .hero h2 {
        font-size: 2rem;
      }
      .section-title {
        font-size: 1.8rem;
      }
      .booking-form {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="container header-flex">
    <div class="logo">
      <i class="fas fa-camera-retro"></i>
      <div>
        <h1>STAR'S PHOTO STUDIO</h1>
        <span>NEPAL • since 2012</span>
      </div>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-link active" data-page="home">Home</a>
      <a href="#" class="nav-link" data-page="portfolio">Portfolio</a>
      <a href="#" class="nav-link" data-page="packages">Packages</a>
      <a href="#" class="nav-link" data-page="booking">Booking</a>
      <a href="#" class="nav-link" data-page="contact">Contact</a>
    </div>
  </div>
</header>

<main id="app-root">
  <!-- dynamic pages will be rendered here -->
</main>

<footer>
  <div class="container">
    <p>© 2025 STAR'S PHOTO STUDIO NEPAL — Professional Photographer in Kathmandu | Wedding & Creative Photography</p>
    <p style="margin-top: 8px;"><i class="fas fa-camera"></i> Capturing timeless stories | Follow us on <i class="fab fa-instagram"></i> <i class="fab fa-facebook"></i></p>
  </div>
</footer>

<script>
  // Page Data: Portfolio, Packages, Tips, Highlights, Contact, SEO-rich content
  const siteData = {
    home: {
      title: "STAR'S PHOTO STUDIO - Best Photographer in Kathmandu",
      heroTitle: "STAR'S PHOTO STUDIO",
      heroSub: "NEPAL • Where memories become art",
      description: "Award-winning wedding & portrait photography studio based in Nepal. We specialize in wedding photos, cinematic couple shoots, and authentic storytelling."
    },
    portfolio: {
      title: "Our Photography Portfolio | Wedding & Events",
      items: [
        { category: "Wedding Story", desc: "Traditional Nepali wedding at heritage palace", img: "https://placehold.co/600x450/2f2e2e/f5c542?text=Wedding+Couple" },
        { category: "Engagement Glow", desc: "Romantic sunset series in Pokhara", img: "https://placehold.co/600x450/3e3a32/f5c542?text=Engagement" },
        { category: "Creative Portraits", desc: "Modern studio portraits & fashion", img: "https://placehold.co/600x450/524b3f/f5c542?text=Portrait" },
        { category: "Event & Candid", desc: "Corporate events & festivals photography", img: "https://placehold.co/600x450/4a3e2e/f5c542?text=Events" }
      ]
    },
    packages: [
      { name: "Golden Hour", price: "Rs. 25,000", features: ["2 hour shoot", "30+ edited images", "Online gallery", "1 outfit change"] },
      { name: "Wedding Elegance", price: "Rs. 85,000", features: ["Full day coverage", "400+ digital images", "Pre-wedding consult", "Professional album (soft)"] },
      { name: "Cinematic Story", price: "Rs. 55,000", features: ["6 hour event", "150+ high-res photos", "Drone shot (selected)", "Print rights"] }
    ],
    photoTips: [
      "Golden hour magic: Shoot just after sunrise or before sunset for dreamy wedding photos.",
      "Candid > posed: Genuine laughter creates the most emotional frames.",
      "Use natural reflectors: White walls, sand, or snow bounce beautiful light.",
      "Always take detail shots: rings, mehendi, decor — tell the full story."
    ],
    clientHighlights: [
      { name: "Anjali & Rohan", feedback: "STAR'S PHOTO STUDIO captured our wedding like a fairy tale! Every emotion was perfect.", location: "Kathmandu" },
      { name: "Sushil Thapa", feedback: "Best photographer in town! Professional, creative and super friendly team.", location: "Lalitpur" },
      { name: "Sophia & Aaditya", feedback: "Incredible destination wedding photos — highly recommend!", location: "Pokhara" }
    ],
    contactInfo: {
      address: "Lakeside Complex, Pokhara - 33700 & Lazimpat, Kathmandu, Nepal",
      phone: "+977 984-1234567",
      email: "hello@starsphotostudio.com.np",
      insta: "@starsphoto_nepal"
    }
  };

  // helper to set active nav
  let currentPage = "home";

  function setActiveNav(pageId) {
    document.querySelectorAll('.nav-link').forEach(link => {
      if(link.getAttribute('data-page') === pageId) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  }

  // Render logic
  function renderPage(page) {
    currentPage = page;
    setActiveNav(page);
    const app = document.getElementById('app-root');
    if (!app) return;
    
    if (page === 'home') {
      app.innerHTML = `
        <section class="hero" style="background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.55)), url('https://placehold.co/1600x700/2c2c2c/f5c542?text=STAR+PHOTOGRAPHY+STUDIO') center/cover no-repeat;">
          <div class="container">
            <h2>${siteData.home.heroTitle}</h2>
            <p>${siteData.home.heroSub}</p>
            <a href="#" class="btn" data-nav="booking">Book Your Session →</a>
          </div>
        </section>
        <div class="container">
          <section id="home-intro">
            <h2 class="section-title">Preserving Moments, Creating Legacy</h2>
            <p style="text-align:center; max-width:800px; margin:0 auto 40px;">Based in the heart of Nepal, we are a premier photo studio specializing in wedding photos, editorial portraits, and authentic storytelling. Each click captures the emotion, culture, and beauty of your special day.</p>
            <div style="display:flex; gap:30px; flex-wrap:wrap; justify-content:center; margin-top:20px;">
              <div style="text-align:center;"><i class="fas fa-camera" style="font-size:2.5rem;color:#f5c542;"></i><h3>Experience</h3><p>12+ Years</p></div>
              <div style="text-align:center;"><i class="fas fa-heart" style="font-size:2.5rem;color:#f5c542;"></i><h3>Happy Couples</h3><p>500+ Weddings</p></div>
              <div style="text-align:center;"><i class="fas fa-award" style="font-size:2.5rem;color:#f5c542;"></i><h3>Awards</h3><p>Wedding Photographer of Year '23</p></div>
            </div>
          </section>
          <!-- Photo Tips & Client Highlights on Home for better engagement -->
          <section>
            <div class="tips-highlights">
              <div class="tips-box">
                <h3><i class="fas fa-lightbulb"></i> Pro Photo Tips</h3>
                <ul class="tips-list">
                  ${siteData.photoTips.map(tip => `<li><i class="fas fa-check-circle"></i> ${tip}</li>`).join('')}
                </ul>
              </div>
              <div class="highlights-box">
                <h3><i class="fas fa-star"></i> Client Highlights</h3>
                ${siteData.clientHighlights.map(c => `
                  <div class="highlight-card">
                    <i class="fas fa-quote-left" style="color:#c49a2b; margin-right:8px;"></i> "${c.feedback}"
                    <div style="margin-top:12px;"><strong>— ${c.name}</strong>, ${c.location}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>
        </div>
      `;
    } 
    else if (page === 'portfolio') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title">Our Creative Portfolio</h2>
            <p style="text-align:center; margin-bottom:40px;">A glance at recent wedding & lifestyle projects. Each frame tells a story of love and artistry.</p>
            <div class="portfolio-grid">
              ${siteData.portfolio.items.map(item => `
                <div class="portfolio-item">
                  <img src="${item.img}" alt="${item.category}">
                  <h3>${item.category}</h3>
                  <p>${item.desc}</p>
                </div>
              `).join('')}
            </div>
            <div style="margin-top: 50px; text-align:center; background:#f9f2e3; border-radius: 32px; padding:30px;">
              <h3>Specializing in Wedding Photos</h3>
              <p>We serve as the top photographer in Kathmandu and across Nepal, handling intimate elopements to grand celebrations.</p>
            </div>
          </section>
        </div>
      `;
    }
    else if (page === 'packages') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title">Packages & Pricing</h2>
            <p style="text-align:center; margin-bottom: 30px;">Transparent pricing designed for every celebration. All packages include professional editing and high-res images.</p>
            <div class="packages-grid">
              ${siteData.packages.map(pkg => `
                <div class="package-card">
                  <h3>${pkg.name}</h3>
                  <div class="price">${pkg.price}</div>
                  <ul>
                    ${pkg.features.map(f => `<li><i class="fas fa-camera" style="margin-right:8px;"></i> ${f}</li>`).join('')}
                  </ul>
                  <a href="#" class="btn" data-nav="booking" style="background:#000; color:#f5c542;">Book This Package</a>
                </div>
              `).join('')}
            </div>
            <div style="margin-top: 48px; text-align:center; background:#fff3e2; border-radius: 40px; padding: 25px;">
              <p><strong>✨ Custom packages available for destination weddings in Nepal. Contact us for tailored pricing.</strong></p>
            </div>
          </section>
        </div>
      `;
    }
    else if (page === 'booking') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title">Reserve Your Date</h2>
            <p style="text-align:center; margin-bottom: 35px;">Fill out the form to check availability or request a quote. We'll respond within 24 hours.</p>
            <div class="booking-form">
              <form id="studioBookingForm">
                <div class="form-group"><input type="text" placeholder="Full Name *" required id="bookName"></div>
                <div class="form-group"><input type="email" placeholder="Email Address *" required id="bookEmail"></div>
                <div class="form-group"><input type="tel" placeholder="Phone / WhatsApp"></div>
                <div class="form-group">
                  <select id="packageSelect">
                    <option value="">Select preferred package</option>
                    <option>Golden Hour (Rs.25,000)</option>
                    <option>Wedding Elegance (Rs.85,000)</option>
                    <option>Cinematic Story (Rs.55,000)</option>
                    <option>Custom / Inquire</option>
                  </select>
                </div>
                <div class="form-group"><input type="date" id="eventDate"></div>
                <div class="form-group"><textarea rows="3" placeholder="Tell us about your event / special requests..."></textarea></div>
                <button type="submit" class="btn" style="background:#000; color:#F5C542;">Send Booking Request</button>
                <p id="bookingMsg" style="margin-top: 16px; text-align:center;"></p>
              </form>
            </div>
            <div style="margin-top: 40px; text-align:center;">
              <i class="fas fa-shield-alt"></i> 100% secure inquiry | We respect your privacy.
            </div>
          </section>
        </div>
      `;
      // attach event after rendering
      const form = document.getElementById('studioBookingForm');
      if(form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('bookName')?.value;
          if(!name) {
            document.getElementById('bookingMsg').innerText = 'Please enter your name.';
            return;
          }
          document.getElementById('bookingMsg').innerHTML = `✅ Thanks ${name}! Your booking request has been sent. We'll reach out soon.`;
          form.reset();
        });
      }
    }
    else if (page === 'contact') {
      app.innerHTML = `
        <div class="container">
          <section>
            <h2 class="section-title">Connect With Us</h2>
            <div class="contact-flex">
              <div class="contact-details">
                <p><i class="fas fa-map-marker-alt"></i> <strong>Studio Locations:</strong> ${siteData.contactInfo.address}</p>
                <p style="margin-top:18px;"><i class="fas fa-phone-alt"></i> ${siteData.contactInfo.phone}</p>
                <p><i class="fas fa-envelope"></i> ${siteData.contactInfo.email}</p>
                <p><i class="fab fa-instagram"></i> ${siteData.contactInfo.insta}</p>
                <hr style="margin: 25px 0;">
                <h3>Photographer in Kathmandu & beyond</h3>
                <p>Available for destination wedding photography throughout Nepal (Pokhara, Chitwan, Mustang) and international assignments.</p>
                <div style="margin-top:24px"><a href="#" class="btn" data-nav="booking">Inquire Now →</a></div>
              </div>
              <div class="map-placeholder">
                <div style="padding:30px;">
                  <i class="fas fa-map-marked-alt" style="font-size: 3rem; margin-bottom: 12px;"></i>
                  <p><strong>Visit our main studio in Lazimpat, Kathmandu</strong><br>Open Mon-Sat: 10AM - 6PM<br>📍 View on Google Maps (coming soon)</p>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    // after rendering, attach dynamic navigation for internal btn's that have data-nav attribute
    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const targetPage = btn.getAttribute('data-nav');
        if(targetPage && ['home','portfolio','packages','booking','contact'].includes(targetPage)) {
          renderPage(targetPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
  }

  // init router + event listeners for nav links
  function initRouting() {
    renderPage('home');

    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const pageId = link.getAttribute('data-page');
        if(pageId) {
          renderPage(pageId);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
  }

  initRouting();
</script>
</body>
</html>
